name: Android Build and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Static architecture guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.kt' -n 'fallbackToDestructiveMigration' app/src; then
            echo 'ERROR: destructive Room migration fallback is forbidden.'
            exit 1
          fi
          if grep -R --include='*.xml' -n 'android.permission.RECEIVE_SMS\|android.permission.READ_SMS' app/src/main/AndroidManifest.xml; then
            echo 'ERROR: POS must not request SMS permissions; SMS belongs to the independent Gateway.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'HAWALATY\|حوالتي' app/src/main; then
            echo 'ERROR: legacy Hawalaty wallet reference found in POS source.'
            exit 1
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-feul-pos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    needs: unit-tests-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: gradle connectedDebugAndroidTest
