name: Android Build and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Static architecture guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.kt' -n 'fallbackToDestructiveMigration' app/src; then
            echo 'ERROR: destructive Room migration fallback is forbidden.'
            exit 1
          fi
          if grep -R --include='*.xml' -n 'android.permission.RECEIVE_SMS\|android.permission.READ_SMS' app/src/main/AndroidManifest.xml; then
            echo 'ERROR: POS must not request SMS permissions; SMS belongs to the independent Gateway.'
            exit 1
          fi
          if grep -R --include='*.kt' -n 'HAWALATY\|حوالتي' app/src/main; then
            echo 'ERROR: legacy Hawalaty wallet reference found in POS source.'
            exit 1
          fi

          if grep -R --include='*.kt' -n 'findPotentialDuplicate\|findRecentSimilar\|timeWindowMillis' app/src; then
            echo 'ERROR: heuristic wallet matching by amount, sender, or time is forbidden.'
            exit 1
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Compile Android instrumentation test APK
        run: gradle assembleDebugAndroidTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-feul-pos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle connectedDebugAndroidTest
